# Example docker-compose for quipclipper-web.
#
# Copy this file to docker-compose.yml, edit the media paths, then run:
#   docker compose up -d        # browse at http://<host>:8896
#   docker compose pull && docker compose up -d   # update to the latest images
#
# It uses the prebuilt public images from GHCR (CI publishes them on every push
# to main), so there is nothing to build locally.

services:
  app:
    image: ghcr.io/weckere/quipclipper-app:latest
    restart: unless-stopped
    environment:
      # Colon-separated media directories to browse/clip from (in-container
      # paths — they must match the right-hand side of the volume mounts below).
      QC_MEDIA_ROOTS: /media/movies:/media/shows
      QC_CLIPS_DIR: /clips
      QC_STATE_DIR: /state
      # nginx serves finished clips directly at /clips/ (see the web service).
      QC_CLIPS_URL_PREFIX: /clips
      # Preferred subtitle language(s) to auto-select, in order (default "en").
      # The UI's Auto-lang box overrides this per browser.
      # QC_SUBTITLE_LANGS: eng,spa
      # Optional defence-in-depth: a shared secret nginx injects on every proxied
      # request so the backend refuses anything reaching port 8000 directly (e.g.
      # another container on this Docker network). Set the SAME value on the web
      # service below. Generate one with `openssl rand -hex 32`.
      # QC_PROXY_SECRET: "paste-a-long-random-string-here"
      # API token(s) for agents/scripts (comma-separated for rotation). A client
      # sends it as X-API-Key, Authorization: Bearer, or `-u api:<token>`; the
      # backend then skips the browser CSRF header. Set the SAME value on the web
      # service so `-u api:<token>` also passes the basic-auth gate. See docs/API.md.
      # QC_API_TOKEN: "paste-a-long-random-string-here"
      # Where downloaded YouTube videos land (the ⬇ Download button). Point it
      # at a folder under a media root — mounted read-WRITE — so a download
      # becomes "<Title> [<id>].mp4" + a .vtt sidecar: a browsable, searchable
      # library item. Unset = kept private in the state dir.
      # QC_YOUTUBE_DIR: /media/youtube/one-offs
    volumes:
      # Your media, mounted READ-ONLY. Left = host path, right = the in-container
      # path referenced by QC_MEDIA_ROOTS above.
      - /path/to/movies:/media/movies:ro
      - /path/to/shows:/media/shows:ro
      # A library quipclipper may write into (YouTube downloads / subtitle
      # backfill) — read-WRITE, and add its in-container path to QC_MEDIA_ROOTS.
      # - /path/to/youtube:/media/youtube
      # Where finished clips are written (read-write).
      - /path/to/clips:/clips
      - quip-state:/state
    expose:
      - "8000"
    healthcheck:
      # The image ships Python (no curl); hit the backend's own health endpoint.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # --- Optional: Intel Quick Sync hardware video transcode -----------------
    # Re-encodes undecodable video (HEVC for Firefox, XviD/MPEG-4 AVIs, …) to
    # H.264 on an Intel iGPU instead of the CPU. Find the render group GID with
    # `getent group render` on the host. Without this it falls back to software.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "render"        # or the numeric GID, e.g. "104"

  web:
    image: ghcr.io/weckere/quipclipper-web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # don't proxy until the backend is ready
    ports:
      - "8896:80"         # browse at http://<host>:8896
    volumes:
      # Same clips directory as the app, read-only — nginx serves downloads.
      - /path/to/clips:/clips:ro
    # --- Optional: password gate (HTTP basic auth) ---------------------------
    # Set QC_PASSWORD to require a login for the whole site (username defaults to
    # "quip"). Leave it unset for an open LAN instance. QC_PROXY_SECRET, if used,
    # must match the value on the app service above (nginx injects it upstream).
    # environment:
    #   QC_PASSWORD: "your-secret"
    #   QC_USERNAME: "quip"
    #   QC_PROXY_SECRET: "paste-a-long-random-string-here"
    #   QC_API_TOKEN: "paste-a-long-random-string-here"   # match the app service

volumes:
  quip-state:
