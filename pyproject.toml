[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quipclipper"
version = "0.1.1"
description = "Find and cut audio/video clips from movies & TV shows by searching the subtitle dialogue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weckere" }]
keywords = ["subtitles", "ffmpeg", "clip", "movie", "dialogue", "search"]
dependencies = [
    "pysubs2>=1.6",   # parses .srt/.vtt/.ass/.sub uniformly
    "rapidfuzz>=3.0", # fast fuzzy ranking
    # CLI. typer 0.27 bundles its own click (typer._click) and no longer installs
    # click; cli.py drives click directly (Context, Choice, Exit), so stay below it
    # until the CLI is ported.
    "typer>=0.12,<0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quipclipper = "quipclipper.cli:app"

[project.urls]
Homepage = "https://github.com/weckere/quipclipper"

[tool.hatch.build.targets.wheel]
packages = ["src/quipclipper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
