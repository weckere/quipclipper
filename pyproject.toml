[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipper"
version = "0.1.0"
description = "Find and cut audio/video clips from movies & TV shows by searching the subtitle dialogue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weckere" }]
keywords = ["subtitles", "ffmpeg", "clip", "movie", "dialogue", "search"]
dependencies = [
    "pysubs2>=1.6",   # parses .srt/.vtt/.ass/.sub uniformly
    "rapidfuzz>=3.0", # fast fuzzy ranking
    "typer>=0.12",    # CLI
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clipper = "clipper.cli:app"

[project.urls]
Homepage = "https://github.com/weckere/clipper"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
