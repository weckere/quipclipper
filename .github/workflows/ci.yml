name: CI

# Work lands on dev; main moves only at a release. release.yml calls this
# workflow on a v* tag before it publishes anything.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine + web backend
        run: |
          pip install -e .
          pip install -e "web/backend[dev]"

      - name: Run web backend tests
        run: pytest -q
        working-directory: web/backend

  # NixOS module VM test (nixosTest): boots a VM with the module enabled and
  # asserts nginx serves the app, the API responds, and the basic-auth gate
  # works. Runs on Linux (the VM needs it).
  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: NixOS module VM test
        run: nix build --print-build-logs .#checks.x86_64-linux.nixos-module
