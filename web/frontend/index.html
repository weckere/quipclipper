<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>quipclipper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1 id="home-link">quipclipper</h1>
      <p class="tagline">Find and cut clips by searching the dialogue.</p>
    </header>

    <main>
      <!-- Library browser -->
      <section id="browser">
        <nav id="breadcrumb" class="breadcrumb"></nav>
        <ul id="entries" class="entries"></ul>
        <p id="browser-empty" class="muted" hidden>Nothing here.</p>
      </section>

      <!-- Item / inspection view -->
      <section id="item" hidden>
        <button id="back" class="back">← Back</button>
        <h2 id="item-name"></h2>

        <video id="player" controls preload="metadata" crossorigin="anonymous"></video>
        <p id="preview-note" class="muted"></p>

        <div class="panel">
          <h3>Subtitles</h3>
          <div id="subs-controls"></div>
        </div>

        <div class="panel">
          <h3>Streams</h3>
          <ul id="streams" class="streams"></ul>
        </div>
      </section>
    </main>

    <footer>
      <span id="status" class="muted">…</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
