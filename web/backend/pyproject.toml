[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quipclipper-web"
version = "0.4.0"  # always the root pyproject.toml's version (scripts/release.sh)
description = "Web app for quipclipper: find and cut clips from a browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weckere" }]
dependencies = [
    "quipclipper",      # the clipping engine (this repo's root package)
    "fastapi>=0.110",   # HTTP API
    "uvicorn>=0.29",    # ASGI server
    "zeroconf>=0.132",  # LAN advertising (quipclipper-web advertise); LGPL-2.1, used as a library
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx powers fastapi's TestClient

[project.scripts]
quipclipper-web = "quipclipper_web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["quipclipper_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
