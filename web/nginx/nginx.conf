# nginx site for quipclipper-web (Docker). The NixOS module generates an
# equivalent virtualHost declaratively. nginx serves the static frontend and
# finished clips directly, and reverse-proxies the API to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Optional HTTP basic-auth gate (Phase 6). The 40-quip-auth.sh entrypoint
    # writes this file at container start: the auth_basic directives when
    # QC_PASSWORD is set, or empty (no auth) otherwise. Applies to every location.
    include /etc/nginx/quip-auth.conf;

    # Optional backend proxy secret. The 50-quip-proxy.sh entrypoint writes
    # quip-proxy.conf (a proxy_set_header line when QC_PROXY_SECRET is set, else
    # empty); each proxied location below includes it so the backend can reject
    # requests that reach its port without going through nginx.

    # Minimal hardening for this LAN appliance. `always` so they're sent on
    # error responses too. Note: nginx add_header does NOT inherit into a
    # location that defines its own add_header, so any such location must
    # repeat these (see the html|js|css block below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # API → backend (the compose service is named "app").
    # `^~` so this prefix wins over the html|js|css regex location below
    # (regex normally outranks prefix matches) — otherwise an API path ending
    # in .js/.css/.html would be mis-served as the SPA.
    # X-Quip-Host is the Host the browser sent, port included ($host drops it): without
    # QC_PUBLIC_URL, Send to LeadStinger links name the address the browser reached this
    # site at. A proxy in front of this one passes its X-Forwarded-Proto/-Host/-Prefix
    # through, and they win.
    location ^~ /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Quip-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
    }

    # Pairing (quipclipper.pair/1). Behind the password gate exactly two requests get
    # through without it: an app asking for access (POST /api/pair) and the app polling
    # its own request (GET /api/pair/<id>, which needs that request's poll secret).
    # Listing, approving and denying requests stay behind the gate.
    location = /api/pair {
        error_page 418 = @quip_pair_open;
        if ($request_method = POST) { return 418; }
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Quip-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;
    }
    location @quip_pair_open {
        auth_basic off;
        auth_request off;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Quip-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;
    }
    location ^~ /api/pair/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Quip-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;
        location ~ "^/api/pair/[A-Za-z0-9_-]+$" {
            auth_basic off;
            auth_request off;
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Quip-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            include /etc/nginx/quip-proxy.conf;
        }
    }

    # A paired app's client token (qcc_..., sent as X-API-Key or Bearer) passes the
    # password gate like the "api" login: quip-auth.conf adds `satisfy any` and an
    # auth_request here, and this asks the backend whether the token is a current one.
    # A request with no client token is answered here, without the backend.
    location = /_quip_client {
        internal;
        set $quip_client_token "";
        if ($http_x_api_key ~ "^qcc_") { set $quip_client_token 1; }
        if ($http_authorization ~* "^bearer +qcc_") { set $quip_client_token 1; }
        if ($quip_client_token = "") { return 401; }
        proxy_pass http://app:8000/api/clients/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        include /etc/nginx/quip-proxy.conf;
    }

    # Raw media file streaming: disable proxy buffering so nginx doesn't spool
    # whole (large) files to disk. Longest-prefix wins, so the more-specific
    # /api/media/transcode block below still takes precedence over this.
    location ^~ /api/media {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_buffering off;
    }

    # Subtitle pre-indexing streams progress and can take several minutes.
    location /api/search/folder/index {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Folder dialogue search can be slow (extracts subs from many files).
    location /api/search/folder {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_read_timeout 300s;
    }

    # Per-item subtitle reindex re-extracts subs, or re-fetches a YouTube
    # transcript via yt-dlp — either can exceed nginx's 60s default. (Adding a
    # YouTube URL is a background job, so /api/youtube itself returns instantly.)
    location /api/items/subtitles/reindex {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_read_timeout 300s;
    }

    # HLS playlist — the first request blocks while ffmpeg produces the opening
    # segment, which a software re-encode of a long source can drag out (see
    # _HLS_START_TIMEOUT in app.py). Longest-prefix wins over /api/media above,
    # whose 60s default would otherwise cut in first and turn the app's clean
    # 504 into a gateway timeout.
    location /api/media/hls {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # Clips library downloads: `?as=flac` converts the clip before the first byte
    # (FlacCache, up to 900 s for a long multichannel clip), and a clip can be
    # large, so stream it unbuffered and wait as long as the conversion may take.
    location ^~ /api/clips/download {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # Transcode stream — disable buffering so ffmpeg output reaches the
    # browser immediately, and allow a long-running connection.
    location /api/media/transcode {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/quip-proxy.conf;  # injects X-Quip-Proxy-Secret when set
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OpenAPI schema + interactive docs (FastAPI). These live at the root, not
    # under /api/, so without these blocks the SPA fall-through would shadow them.
    # Exact matches so they don't shadow any real SPA route. Behind the same
    # basic-auth gate as everything else. /openapi.json is the machine-readable
    # contract for API clients; /docs (Swagger) and /redoc are for humans.
    location = /openapi.json {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        include /etc/nginx/quip-proxy.conf;
    }
    location = /docs {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        include /etc/nginx/quip-proxy.conf;
    }
    location = /redoc {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        include /etc/nginx/quip-proxy.conf;
    }

    # Finished clips, served straight off the shared volume.
    # `^~` so this prefix wins over the html|js|css regex location below.
    location ^~ /clips/ {
        alias /clips/;
    }

    # App shell + assets: there's no content hashing in the filenames, so tell
    # the browser to always revalidate. nginx still answers with 304 when the
    # file is unchanged (cheap), but a deploy is picked up immediately instead
    # of being served stale from the browser's heuristic cache.
    location ~* \.(?:html|js|css)$ {
        # This location's own add_header suppresses inheritance of the
        # server-level security headers, so repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Static SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
